<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuádruplos · Vista previa</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./src/ui/quadruples/view.css" />
  <script type="module" src="./src/ui/quadruples/preview.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-icon" aria-hidden="true">{ }</span>Java / Laboratorio de compilación</a>
    <span class="course">Lenguajes y Autómatas II</span>
  </header>
  <main>
    <div class="results-heading">
      <h1 class="quadruples-preview-heading">Vista previa</h1>
      <label class="quadruples-example">Ejemplo
        <select id="quadruples-example">
          <option value="viernes">Viernes</option>
          <option value="long">Secuencia de 128 registros</option>
          <option value="partial">Evaluación parcial</option>
          <option value="invalid">Secuencia inválida</option>
          <option value="empty">Sin resultados</option>
        </select>
      </label>
    </div>
    <div id="quadruples-preview"></div>
    <p id="preview-error" class="status" role="alert" hidden></p>
  </main>
</body>
</html>
